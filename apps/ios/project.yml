name: PennyOffline
options:
  bundleIdPrefix: ca.penny.offline
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
targets:
  PennyOffline:
    type: application
    platform: iOS
    sources: [PennyOffline]
    info:
      path: PennyOffline/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BGTaskSchedulerPermittedIdentifiers: [ca.penny.offline.backup.processing]
        UIBackgroundModes: [processing]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.penny.offline.dev
        SWIFT_OBJC_BRIDGING_HEADER: PennyOffline/LocalReceiptFileProtection.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: Capture a receipt on this device for your encrypted expense vault. Penny does not save camera captures to your photo library.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_CFBundleDisplayName: Penny Offline
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  PennyOfflineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PennyOfflineTests
      - path: ../../packages/offline-contract/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: PennyOffline
  PennyOfflineDurableProcessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PennyOfflineDurableProcessTests
      - path: ../../packages/offline-contract/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: PennyOffline
  PennyOfflinePerformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PennyOfflinePerformanceTests]
    dependencies:
      - target: PennyOffline
  PennyOfflineAccessibilityTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PennyOfflineAccessibilityTests]
    dependencies:
      - target: PennyOffline
  PennyOfflineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PennyOfflineUITests]
    dependencies:
      - target: PennyOffline
schemes:
  PennyOffline:
    build:
      targets:
        PennyOffline: all
    test:
      gatherCoverageData: true
      targets:
        - PennyOfflineTests
        - PennyOfflineUITests
  PennyOfflinePerformance:
    build:
      targets:
        PennyOffline: all
        PennyOfflinePerformanceTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - PennyOfflinePerformanceTests
  PennyOfflineAccessibility:
    build:
      targets:
        PennyOffline: all
        PennyOfflineAccessibilityTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - PennyOfflineAccessibilityTests
  PennyOfflineDurableProcess:
    build:
      targets:
        PennyOffline: all
        PennyOfflineDurableProcessTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - PennyOfflineDurableProcessTests
